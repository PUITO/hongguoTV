name: Build APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept licenses & ensure platform
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          # Install platform if missing
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || \
            yes | "$ANDROID_HOME/cmdline-tools/$(ls "$ANDROID_HOME/cmdline-tools" | tail -1)/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Build phone + tv debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :phone:assembleDebug :tv:assembleDebug --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-debug
          path: tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create prerelease on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          prerelease: true
          files: |
            phone/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
